[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
deb822-fast = "0.2"
percent-encoding = "2.3.2"
rd-rds = { version = "0.2.0", default-features = false, features = ["gzip", "zstd"] }
pubgrub = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
flate2 = "1"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
