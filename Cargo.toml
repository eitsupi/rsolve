[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
deb822-fast = "0.2"
md-5 = "0.10"
jiff = { version = "0.2", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
rd-rds = "0.4.0"
pubgrub = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "1.1.3"
flate2 = "1"
fastrand = "2"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
serde_json = "1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
redb = "4.2"
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }
tempfile = "3"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
windows-sys = "0.61"
