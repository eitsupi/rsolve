[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
deb822-fast = "0.2"
md-5 = "0.10"
percent-encoding = "2.3.2"
rd-rds = { version = "0.2.0", default-features = false, features = ["gzip", "zstd"] }
pubgrub = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "1.1.3"
flate2 = "1"
serde_json = "1"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
