# nextest 0.9.143 validates binary(...) names while loading this file. Opt-in
# binaries are excluded from the default profile and selected only by their
# dedicated profiles.
[profile.default]
default-filter = "not binary(r_interop) & not binary(repository_r_interop) & not binary(pak_portable)"
slow-timeout = { period = "10s", terminate-after = 12 }
fail-fast = false

[profile.ci]
inherits = "default"
failure-output = "immediate-final"
final-status-level = "slow"
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

[profile.r-interop]
inherits = "ci"
default-filter = "binary(r_interop) | binary(repository_r_interop)"

[profile.pak-portable]
inherits = "ci"
default-filter = "binary(pak_portable)"

[profile.pak-isolated]
inherits = "ci"
default-filter = "not all()"

[profile.live-network]
inherits = "ci"
default-filter = "not all()"

[test-groups]
r-process = { max-threads = 1 }
pak-isolated = { max-threads = 1 }
pak-portable = { max-threads = 1 }
live-network = { max-threads = 1 }

[[profile.r-interop.overrides]]
filter = "binary(r_interop) | binary(repository_r_interop)"
test-group = "r-process"
slow-timeout = { period = "30s", terminate-after = 10 }

[[profile.pak-isolated.overrides]]
filter = "not all()"
test-group = "pak-isolated"
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.pak-portable.overrides]]
filter = "binary(pak_portable)"
test-group = "pak-portable"
slow-timeout = { period = "120s", terminate-after = 15 }

[[profile.live-network.overrides]]
filter = "not all()"
test-group = "live-network"
slow-timeout = { period = "30s", terminate-after = 20 }
